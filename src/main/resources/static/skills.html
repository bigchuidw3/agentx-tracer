<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills 管理 · AgentX Tracer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/shell.css">
    <link rel="stylesheet" href="css/skills.css">
    <!-- Inter 字体 -->
    
    <!-- Vue 3 CDN -->
    <script src="vendor/js/vue.global.js"></script>
    <!-- 图标库 -->
    <link rel="stylesheet" href="vendor/css/all.min.css">
    <script>
        // 在 Vue 加载前应用主题，避免初始白屏闪烁（common.js 也会做一次）
        (function () {
            var t = 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div id="da-skills-app">
        <!-- 顶栏：由 common.js 的 renderHeader 渲染到 #da-header-host -->
        <div id="da-header-host"></div>

        <!-- 主区 -->
        <main class="da-skills-main">
            <div class="da-skills-page">
                <!-- 页面头部 -->
                <div class="ax-page-head">
                    <div>
                        <h2><i class="fas fa-bolt"></i> Skills 管理</h2>
                        <p class="ax-page-sub">技能扩展管理：平台技能所有人可用，上传的个人技能仅自己可见</p>
                    </div>
                    <div class="da-skill-upload-area"
                         @click="triggerSkillUpload"
                         @dragover.prevent="uploadDragOver = true"
                         @dragleave.prevent="uploadDragOver = false"
                         @drop.prevent="onSkillDrop"
                         :class="{ active: uploadDragOver }">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>{{ skillUploading ? '上传中...' : '上传 Skill (.zip)' }}</span>
                        <input ref="skillFileInputRef" type="file" style="display:none"
                               @change="onSkillFileSelected" accept=".zip" />
                    </div>
                </div>

                <!-- 平台技能（内置，只读） -->
                <template v-if="builtinSkills.length">
                    <div class="ax-skill-group-title"><i class="fas fa-cube"></i> 平台技能<span>内置能力，所有人可用</span></div>
                    <div class="da-skill-grid">
                        <div v-for="s in builtinSkills" :key="s.storageKey"
                             class="da-skill-manage-card readonly" :class="{ disabled: !s.enabled }"
                             :title="s.description || '（无描述）'">
                            <div class="da-skill-manage-top">
                                <span class="ax-chip info"><span class="dot"></span>内置</span>
                            </div>
                            <div class="da-skill-manage-body">
                                <div class="da-skill-manage-name-row">
                                    <i class="fas fa-star"></i>
                                    <span class="da-skill-manage-name">{{ s.name }}</span>
                                </div>
                                <p class="da-skill-manage-desc">{{ s.description || '（无描述）' }}</p>
                            </div>
                            <div class="da-skill-manage-actions">
                                <button class="da-btn-danger" disabled title="平台内置技能不可删除">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 我的技能（仅本人可见） -->
                <div class="ax-skill-group-title"><i class="fas fa-user-gear"></i> 我的技能<span>上传后仅自己可用</span></div>
                <div class="da-skill-grid" v-if="mySkills.length">
                    <div v-for="s in mySkills" :key="s.storageKey"
                         class="da-skill-manage-card"
                         :class="{ disabled: !s.enabled }"
                         :title="s.description || '（无描述）'">
                        <!-- 左上角：启用/禁用开关 -->
                        <div class="da-skill-manage-top">
                            <label class="da-skill-toggle" :title="s.enabled ? '点击禁用' : '点击启用'">
                                <input type="checkbox" :checked="s.enabled"
                                       @change="toggleSkill(s.storageKey, $event.target.checked)" />
                                <span class="da-skill-toggle-slider"></span>
                            </label>
                        </div>
                        <!-- 主体：name + desc -->
                        <div class="da-skill-manage-body">
                            <div class="da-skill-manage-name-row">
                                <i class="fas fa-star"></i>
                                <span class="da-skill-manage-name">{{ s.name }}</span>
                            </div>
                            <p class="da-skill-manage-desc">{{ s.description || '（无描述）' }}</p>
                        </div>
                        <!-- 右下角：删除按钮 -->
                        <div class="da-skill-manage-actions">
                            <button @click="deleteSkill(s.storageKey)" title="删除" class="da-btn-danger">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 空状态：仅在「我的技能」为空时展示 -->
                <div v-if="!mySkills.length && !loading" class="da-skill-page-empty slim">
                    <p>暂无个人技能，上传 .zip 安装到「我的技能」</p>
                </div>
                <div v-else-if="!mySkills.length" class="da-skill-page-empty">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>加载中…</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 共享工具层 -->
    <script src="js/common.js"></script>
    <!-- Skills 页逻辑 -->
    <script src="js/skills.js"></script>
</body>
</html>
